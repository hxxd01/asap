# ========================================
# Termination 配置 - 防止采集无效轨迹
# ========================================
use_termination: True  # 是否启用termination机制

# 重力投影termination（主要条件）
# 当机器人倒地时，重力在x/y方向的投影会超过阈值
termination_gravity_x: 0.85  # x方向重力投影阈值 (0.8 ≈ 36度倾斜)
termination_gravity_y: 0.85  # y方向重力投影阈值 (0.8 ≈ 36度倾斜)

# 基座高度termination（辅助条件） 
# # 机器人蹲下或倒地时基座高度会明显降低
# termination_min_height: 0.3  # 最小基座高度(米)，低于此高度则终止

# 扭矩过大termination（可选条件）
# 关节扭矩接近限制时可能表明机器人状态异常
# termination_max_torque_ratio: 0.95  # 扭矩与限制的最大比值 (0.95 = 95%)

 