# @package _global_
# 纯残差动作模型观测配置 + 历史观测版本
# 在原始82维基础上增加约300维历史信息，总计约382维
# 保留原有的base_rot、base_pos等重要信息，同时增加历史观测能力

obs:
  obs_dict:
    # 残差网络输入观测 (约382维)
    actor_obs: [
      base_rot,        # 基座四元数方向 (4维)
      base_lin_vel,    # 基座线速度 (3维)  
      base_pos,        # 3D位置 (3维)
      base_ang_vel,    # 角速度 (3维)
      dof_pos,         # 关节角度 (23维)
      dof_vel,         # 关节速度 (23维)
      z_actions,       # 当前PKL动作 (23维)
      projected_gravity, # 重力投影 (3维) - 新增
      ref_motion_phase,  # 参考运动相位 (1维) - 新增
      history_delta_actor # 历史观测 (约300维) - 新增
      # 总计: 4+3+3+3+23+23+23+3+1+300 = 386维
    ]
    
    # 预训练模型输入观测 (保持380维兼容)
    closed_loop_actor_obs: [
      base_ang_vel,     # base角速度 (3维)
      projected_gravity, # 重力投影 (3维)
      dof_pos,          # 关节角度 (23维)
      dof_vel,          # 关节速度 (23维)
      actions,          # 上一时刻动作 (23维)
      ref_motion_phase, # 参考运动相位 (1维)
      history_actor     # 历史观测 (304维)
      # 总计: 3+3+23+23+23+1+304 = 380维
    ]
    
    # 评价网络输入观测
    critic_obs: [
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      base_pos,        # 保留位置信息用于评价
      base_rot,        # 保留姿态信息用于评价
      dof_pos,
      dof_vel,
      actions,
      ref_motion_phase,
      dif_local_rigid_body_pos,
      local_ref_rigid_body_pos,
      history_critic,
      z_actions
    ]

  # 历史观测配置
  obs_auxiliary:
    # 为残差网络设计的历史观测 (约300维)
    history_delta_actor: {
      base_rot: 4,        # 4个时间步的姿态历史 (4×4=16维)
      base_lin_vel: 4,    # 4个时间步的线速度历史 (4×3=12维)
      base_pos: 4,        # 4个时间步的位置历史 (4×3=12维)
      base_ang_vel: 4,    # 4个时间步的角速度历史 (4×3=12维)
      dof_pos: 4,         # 4个时间步的关节角度历史 (4×23=92维)
      dof_vel: 4,         # 4个时间步的关节速度历史 (4×23=92维)
      actions: 4,       # 4个时间步的PKL动作历史 (4×23=92维)
      projected_gravity: 4 # 4个时间步的重力投影历史 (4×3=12维)
      # 总计: 16+12+12+12+92+92+92+12 = 340维
    }
    
    # 为预训练模型保持的历史观测 (304维)
    history_actor: {
      base_ang_vel: 4,      # 4个时间步的角速度历史 (4×3=12维)
      projected_gravity: 4, # 4个时间步的重力投影历史 (4×3=12维)
      dof_pos: 4,          # 4个时间步的关节角度历史 (4×23=92维)
      dof_vel: 4,          # 4个时间步的关节速度历史 (4×23=92维)
      actions: 4,          # 4个时间步的动作历史 (4×23=92维)
      ref_motion_phase: 4  # 4个时间步的相位历史 (4×1=4维)
    }
    
    # 评价网络历史观测
    history_critic: {
      base_lin_vel: 4,
      base_ang_vel: 4,
      projected_gravity: 4,
      base_pos: 4,
      base_rot: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      ref_motion_phase: 4
    }

  # 观测缩放配置
  obs_scales: {
    base_rot: 5.0,
    base_pos: 7.0,
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    dif_local_rigid_body_pos: 1.0,
    local_ref_rigid_body_pos: 1.0,
    ref_motion_phase: 1.0,
    history_actor: 1.0,
    history_delta_actor: 1.0,
    history_critic: 1.0,
    z_actions: 1.0,
  }

  # 噪声配置
  noise_scales: {
    base_rot: 0.0,
    base_pos: 0.0,
    base_lin_vel: 0.0,
    base_ang_vel: 0.3,
    projected_gravity: 0.2,
    dof_pos: 0.01,
    dof_vel: 1.0,
    actions: 0.0,
    dif_local_rigid_body_pos: 0.0,
    local_ref_rigid_body_pos: 0.0,
    ref_motion_phase: 0.0,
    history_actor: 0.0,
    history_delta_actor: 0.0,
    history_critic: 0.0,
    z_actions: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42

  obs_dims:
    - base_pos: 3
    - base_rot: 4
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - z_actions: ${robot.dof_obs_size}
    - actions: ${robot.dof_obs_size}
    - dif_local_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 9'} # hardcoded for 3 extended body
    - local_ref_rigid_body_pos: ${eval:'3 * ${robot.num_bodies} + 9'}
    - ref_motion_phase: 1

  post_compute_config: {} # Will store values after preprocessing, don't put anything here 